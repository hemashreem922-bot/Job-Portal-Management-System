# Application Name & Server
spring.application.name=job-portal
server.port=8080

# Default Database: Persistent H2 SQL Database (Runs instantly with zero setup)
spring.datasource.url=jdbc:h2:file:./data/jobportaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/
